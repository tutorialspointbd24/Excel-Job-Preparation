<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>এক্সেল চাকুরী পরীক্ষার প্রশ্ন ৯১-১০০ | চূড়ান্ত গাইড</title>
  <!-- Google Font for Bengali -->
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #e7f0ec 0%, #cfe3d8 100%);
      font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(15px);
      border-radius: 3rem;
      box-shadow: 0 35px 60px rgba(0, 20, 30, 0.3);
      padding: 2.5rem 2rem 3rem;
      margin: 1rem auto;
      border: 1px solid rgba(255,255,255,0.7);
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .excel-badge {
      background: #1f6e43;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 0.6rem 2rem;
      border-radius: 50px;
      display: inline-block;
      margin-bottom: 1.2rem;
      letter-spacing: 0.5px;
      box-shadow: 0 10px 20px rgba(31, 110, 67, 0.4);
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      color: #0a3222;
      line-height: 1.3;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.03);
    }

    .subhead {
      font-size: 1.25rem;
      color: #1a4d37;
      margin-top: 0.8rem;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.7);
      display: inline-block;
      padding: 0.6rem 2rem;
      border-radius: 40px;
      backdrop-filter: blur(5px);
      border: 1px solid #cde5d8;
    }

    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.2rem;
      margin: 2.5rem 0 1rem;
    }

    .stat-item {
      background: white;
      padding: 0.9rem 2rem;
      border-radius: 50px;
      font-weight: 600;
      color: #0e3d2a;
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 2rem;
      margin-top: 1.5rem;
    }

    .card {
      background: #ffffff;
      border-radius: 2.2rem;
      padding: 2rem 1.8rem;
      box-shadow: 0 20px 35px rgba(0, 20, 15, 0.12);
      transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      border: 1px solid rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, #2e8b57, #6fbf8f, #2e8b57);
      opacity: 0.8;
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 35px 50px rgba(0, 40, 20, 0.25);
      border-color: #a7d0b9;
      background: #fcfefe;
    }

    .card-number {
      background: #e1f0e6;
      color: #0f5132;
      font-weight: 700;
      font-size: 1.6rem;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin-bottom: 1.2rem;
      box-shadow: 0 6px 12px rgba(0,80,40,0.2);
    }

    .card h3 {
      font-size: 1.7rem;
      font-weight: 700;
      color: #0c3b28;
      margin-bottom: 1.2rem;
      line-height: 1.4;
      border-left: 6px solid #2e8b57;
      padding-left: 18px;
    }

    .question-text {
      font-size: 1rem;
      font-weight: 500;
      color: #1b362a;
      margin-bottom: 0.8rem;
      background: #f4faf7;
      padding: 1rem 1.2rem;
      border-radius: 1.2rem;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.5;
      border: 1px solid #d8eae0;
    }

    .answer-text {
      font-size: 1rem;
      color: #1e3a2c;
      background: #fefefe;
      padding: 1.2rem 1.2rem;
      border-radius: 1.2rem;
      line-height: 1.7;
      border: 1px solid #d0e4d8;
      margin: 0.7rem 0 0.3rem;
      word-break: break-word;
    }

    .code-snippet {
      background: #1c2b24;
      color: #ddf2e5;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      padding: 1rem 1.2rem;
      border-radius: 1rem;
      margin: 1rem 0 0.5rem;
      letter-spacing: 0.3px;
      overflow-x: auto;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
      word-break: break-all;
      white-space: pre-wrap;
    }

    .detail-toggle {
      margin-top: 1rem;
      padding-top: 1rem;
      text-align: right;
      font-size: 0.95rem;
      color: #2e6b4f;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #dcebe3;
    }

    .toggle-btn {
      background: #e8f3ed;
      border: none;
      color: #155a37;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.25s;
      padding: 0.5rem 1.4rem;
      border-radius: 40px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .toggle-btn:hover {
      background: #cfe8da;
      color: #0a3d24;
      box-shadow: 0 4px 10px rgba(0,60,30,0.15);
    }

    .extra-detail {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s ease-in-out;
      margin-top: 0.8rem;
      background: #f9fffc;
      border-radius: 1.2rem;
      border: 1px dashed #a8cfba;
    }

    .extra-detail.show {
      max-height: 700px;
    }

    .extra-content {
      padding: 1.2rem 1.3rem;
      font-size: 1rem;
      color: #1d4230;
      line-height: 1.7;
      display: flex;
      gap: 10px;
    }

    .extra-content i {
      color: #2a7855;
      margin-top: 4px;
    }

    .footer-note {
      text-align: center;
      margin-top: 3rem;
      background: #1a4a33;
      color: white;
      padding: 1.5rem;
      border-radius: 2rem;
      font-size: 1.2rem;
      font-weight: 500;
      box-shadow: 0 15px 25px rgba(0,0,0,0.2);
      letter-spacing: 0.3px;
    }

    .footer-note i {
      margin-right: 10px;
      color: #ffd966;
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 2.1rem;
      }
      .container {
        padding: 1.5rem 1rem;
      }
      .card {
        padding: 1.5rem 1.2rem;
      }
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="excel-badge"><i class="fas fa-table"></i> MS EXCEL COMPLETE</div>
      <h1>চাকুরী পরীক্ষায় কমন<br>এক্সেল প্রশ্ন ৯১-১০০</h1>
      <div class="subhead">চূড়ান্ত পর্যায়ের বিস্তারিত উত্তর, ফর্মুলা, শর্টকাট ও টিপস সহ</div>
      <div class="stats-bar">
        <span class="stat-item"><i class="fas fa-check-circle" style="color:#2e8b57;"></i> ১০টি ফাইনাল টপিক</span>
        <span class="stat-item"><i class="fas fa-file-alt" style="color:#c45a32;"></i> গভীর ব্যাখ্যা</span>
        <span class="stat-item"><i class="fas fa-code" style="color:#1e6f9f;"></i> ফর্মুলা ও উদাহরণ</span>
      </div>
    </header>

    <div class="grid" id="questionGrid">
      <!-- ডাইনামিক কার্ড জাভাস্ক্রিপ্ট দিয়ে বসবে -->
    </div>

    <div class="footer-note">
      <i class="fas fa-trophy"></i> চূড়ান্ত টিপস: ১০০টি প্রশ্নের সবগুলো আয়ত্ত করুন। ব্যবহারিক পরীক্ষায় সফলতার জন্য হাতে-কলমে অনুশীলন অপরিহার্য। শুভকামনা!
    </div>
  </div>

  <script>
    (function() {
      // ৯১-১০০ নং প্রশ্নের বিস্তারিত ডেটা
      const excelQuestions = [
        {
          number: 91,
          title: "এক্সেল ভিবিএ ফর্ম",
          question: "VBA UserForm কীভাবে তৈরি করা হয়?",
          answer: "VBA Editor-এ Insert → UserForm নির্বাচন করে UserForm তৈরি করা হয়। Toolbox থেকে TextBox, CommandButton, Label ইত্যাদি ড্র্যাগ করে ফর্মে যোগ করা যায়।",
          extra: "কমান্ড বাটনে ক্লিক করলে কোড চালানোর জন্য বাটনে ডাবল ক্লিক করে কোড লিখুন। ফর্ম চালাতে F5 চাপুন।",
          code: "VBA Editor > Insert > UserForm > Toolbox > Controls"
        },
        {
          number: 92,
          title: "এক্সেল কাস্টম ফাংশন",
          question: "VBA দিয়ে কাস্টম ফাংশন কীভাবে তৈরি করা হয়?",
          answer: "Function কিওয়ার্ড দিয়ে VBA-তে কাস্টম ফাংশন তৈরি করা যায়। যেমন Function Double(x) Double = x*2 End Function।",
          extra: "VBA Editor-এ Module-এ ফাংশন লিখুন। তারপর এক্সেল শিটে =Double(5) লিখলে 10 রিটার্ন করবে।",
          code: "Function Double(x)\n    Double = x * 2\nEnd Function"
        },
        {
          number: 93,
          title: "এক্সেল অটোমেশন",
          question: "Excel Automation বলতে কী বোঝায়?",
          answer: "Excel Automation হলো VBA ম্যাক্রো, Power Query, Power Pivot ব্যবহার করে পুনরাবৃত্তিমূলক কাজ স্বয়ংক্রিয় করা। যেমন ডেটা ক্লিনিং, রিপোর্ট তৈরি, ডেটা আপডেট।",
          extra: "Automation সময় বাঁচায় এবং ভুল কমায়। VBA দিয়ে ইমেইল পাঠানো, ফাইল সেভ করা, ডেটা প্রসেস করা সম্ভব।",
          code: "Sub AutoOpen()\n    MsgBox \"Welcome\"\nEnd Sub"
        },
        {
          number: 94,
          title: "এক্সেল রিবন কাস্টমাইজেশন",
          question: "Excel Ribbon কীভাবে কাস্টমাইজ করা হয়?",
          answer: "File → Options → Customize Ribbon থেকে নতুন ট্যাব, গ্রুপ ও কমান্ড যোগ করা যায়। নিজস্ব ম্যাক্রো রিবনে বাটন হিসেবে যোগ করা সম্ভব।",
          extra: "কাস্টম ট্যাবে গুরুত্বপূর্ণ কমান্ড যোগ করে কাজ দ্রুত করা যায়। রিবনে রাইট ক্লিক → Customize the Ribbon দিয়েও যাওয়া যায়।",
          code: "File > Options > Customize Ribbon > New Tab"
        },
        {
          number: 95,
          title: "এক্সেল কুইক এক্সেস টুলবার",
          question: "Quick Access Toolbar কীভাবে কাস্টমাইজ করা হয়?",
          answer: "Quick Access Toolbar-এর ডান পাশের তীর → More Commands → যেকোনো কমান্ড যোগ করা যায়। Alt+সংখ্যা শর্টকাট হিসেবে কাজ করে।",
          extra: "প্রায় ব্যবহৃত কমান্ড যেমন Save, Undo, Redo, Print, Camera Tool যোগ করুন।",
          code: "Quick Access Toolbar > More Commands > Add"
        },
        {
          number: 96,
          title: "এক্সেল মোবাইল অ্যাপ",
          question: "Excel Mobile App-এর সীমাবদ্ধতা কী?",
          answer: "মোবাইল অ্যাপে বেসিক এডিটিং, ফিল্টার, সর্ট, চার্ট তৈরি করা যায়। কিন্তু VBA ম্যাক্রো, Power Pivot, Data Model সমর্থন করে না।",
          extra: "OneDrive-এর সাথে সিঙ্ক হয়, তাই ফাইল সব ডিভাইসে অ্যাক্সেস করা যায়। টাচ স্ক্রিনের জন্য অপ্টিমাইজড।",
          code: "Mobile: View, Edit, Share, Filter, Sort"
        },
        {
          number: 97,
          title: "এক্সেল সিকিউরিটি",
          question: "Excel ফাইলে পাসওয়ার্ড সেট করার নিয়ম কী?",
          answer: "File → Info → Protect Workbook → Encrypt with Password → পাসওয়ার্ড দিন। ফাইল খুলতে পাসওয়ার্ড চাইবে।",
          extra: "আলাদাভাবে শিট প্রোটেক্ট করা যায় Review → Protect Sheet। পাসওয়ার্ড ভুলে গেলে রিকভারি কঠিন।",
          code: "File > Info > Protect Workbook > Encrypt with Password"
        },
        {
          number: 98,
          title: "এক্সেল এক্সপোর্ট",
          question: "Excel ডেটা কীভাবে PDF বা CSV আকারে এক্সপোর্ট করা হয়?",
          answer: "File → Export → Create PDF/XPS Document → Publish → PDF সেভ করুন। CSV আকারে File → Save As → Save as type: CSV UTF-8।",
          extra: "PDF ফরম্যাটে প্রিন্ট লেআউট ঠিক থাকে। CSV শুধুমাত্র ডেটা ধরে রাখে, ফরম্যাটিং ও ম্যাক্রো হারিয়ে যায়।",
          code: "File > Export > Create PDF/XPS\nFile > Save As > CSV UTF-8"
        },
        {
          number: 99,
          title: "এক্সেল অ্যাক্সেসিবিলিটি",
          question: "Excel Accessibility Checker কী কাজে লাগে?",
          answer: "Accessibility Checker শিটের এমন সমস্যা চিহ্নিত করে যা দৃষ্টি বা শ্রবণ প্রতিবন্ধী ব্যবহারকারীদের জন্য সমস্যা সৃষ্টি করতে পারে — যেমন Alt Text না থাকা, কম কনট্রাস্ট।",
          extra: "Review → Check Accessibility চাপুন। সমস্যার তালিকা দেখে ঠিক করুন। অল্টারনেটিভ টেক্সট যোগ করা উচিত।",
          code: "Review > Check Accessibility"
        },
        {
          number: 100,
          title: "এক্সেল বেস্ট প্র্যাকটিস",
          question: "এক্সেলে দক্ষতার জন্য সেরা অনুশীলনগুলো কী কী?",
          answer: "১. ফর্মুলার পরিবর্তে টেবিল ব্যবহার করা। ২. নামযুক্ত রেঞ্জ ব্যবহার। ৩. নিয়মিত সেভ ও ব্যাকআপ। ৪. শর্টকাট কী আয়ত্ত। ৫. ডেটা ভ্যালিডেশন ব্যবহার। ৬. জটিল ফর্মুলা ডকুমেন্ট করা।",
          extra: "বড় ডেটাসেটে অপ্রয়োজনীয় ফরম্যাটিং এড়িয়ে চলুন। ফর্মুলা অডিটিং টুল ব্যবহার করুন। নিয়মিত অটোসেভ সেটিংস চেক করুন।",
          code: "Best Practice: Named Range, Table, Data Validation, Shortcuts"
        }
      ];

      const grid = document.getElementById('questionGrid');

      excelQuestions.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
          <div class="card-number">${item.number}</div>
          <h3>${item.title}</h3>
          <div class="question-text"><i class="fas fa-question-circle" style="color:#2e8b57; margin-top:4px;"></i> ${item.question}</div>
          <div class="answer-text"><i class="fas fa-reply" style="color:#c45a32; margin-right:8px;"></i> ${item.answer}</div>
          ${item.code ? `<div class="code-snippet"><i class="fas fa-terminal" style="margin-right:8px;"></i>${item.code}</div>` : ''}
          <div class="detail-toggle">
            <button class="toggle-btn"><i class="fas fa-chevron-circle-down"></i> বিস্তারিত দেখুন</button>
          </div>
          <div class="extra-detail">
            <div class="extra-content">
              <i class="fas fa-info-circle"></i>
              <span>${item.extra}</span>
            </div>
          </div>
        `;

        const toggleBtn = card.querySelector('.toggle-btn');
        const extraDiv = card.querySelector('.extra-detail');

        function toggleExtra() {
          const isOpen = extraDiv.classList.contains('show');
          if (isOpen) {
            extraDiv.classList.remove('show');
            toggleBtn.innerHTML = '<i class="fas fa-chevron-circle-down"></i> বিস্তারিত দেখুন';
          } else {
            extraDiv.classList.add('show');
            toggleBtn.innerHTML = '<i class="fas fa-chevron-circle-up"></i> সংক্ষিপ্ত করুন';
          }
        }

        toggleBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleExtra();
        });

        card.addEventListener('click', (e) => {
          if (e.target.closest('.toggle-btn')) return;
          toggleExtra();
        });

        grid.appendChild(card);
      });
    })();
  </script>
</body>
</html>
